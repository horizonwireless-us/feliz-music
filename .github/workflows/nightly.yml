name: Nightly Build

# Nightly application: com.jtech.felizmusic.nightly. Built from main with the
# separate nightly signing key and published via GitHub Actions artifacts and
# nightly.link. Installs alongside stable with independent local data.
on:
  push:
    branches: [ main ]

jobs:
  nightly:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check out pinned cipher
        run: bash scripts/checkout-cipher.sh

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install pinned native build components
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "platforms;android-36" "ndk;27.0.12077973" "cmake;3.22.1"

      - name: Configure Android SDK path
        run: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties
          echo "sdk.dir=$ANDROID_SDK_ROOT" > .deps/feliz-cipher/local.properties

      - name: Configure Firebase (nightly app registered separately)
        run: echo "${{ secrets.GOOGLE_SERVICES_JSON_NIGHTLY_BASE64 }}" | base64 -d > app/google-services.json

      - name: Configure nightly release keystore
        run: |
          mkdir -p app/keystore
          echo "${{ secrets.NIGHTLY_KEYSTORE_BASE64 }}" | base64 -d > app/keystore/release.keystore
          {
            echo "STORE_PASSWORD=${{ secrets.NIGHTLY_STORE_PASSWORD }}"
            # Release keystores are JKS (converted from JDK 21 PKCS12 because
            # Android apksig cannot read that PKCS12 variant). JKS key passwords
            # are independent of the store password, so KEY_PASSWORD uses the
            # NIGHTLY_KEY_PASSWORD secret (matches signing-credentials.txt).
            echo "KEY_PASSWORD=${{ secrets.NIGHTLY_KEY_PASSWORD }}"
            echo "KEY_ALIAS=${{ secrets.NIGHTLY_KEY_ALIAS }}"
          } >> "$GITHUB_ENV"

      - name: Verify nightly release keystore
        run: |
          if [ ! -s app/keystore/release.keystore ]; then
            echo "::error::app/keystore/release.keystore is empty; NIGHTLY_KEYSTORE_BASE64 did not decode to a keystore."
            exit 1
          fi
          if ! keytool -list \
            -keystore app/keystore/release.keystore \
            -storetype JKS \
            -storepass "$STORE_PASSWORD" \
            -alias "$KEY_ALIAS" >/dev/null; then
            echo "::error::Could not open app/keystore/release.keystore with STORE_PASSWORD and alias '$KEY_ALIAS'. Check NIGHTLY_KEYSTORE_BASE64, NIGHTLY_STORE_PASSWORD, and NIGHTLY_KEY_ALIAS."
            exit 1
          fi

      - name: Assemble signed nightly release
        run: ./gradlew :app:assembleNightlyRelease -PfelizCipherPath=.deps/feliz-cipher -PfirebaseProjectId=feliz-music-admin

      - name: Check 16 KB page-size alignment
        run: bash scripts/check-16kb-alignment.sh app/build/outputs/apk/nightly/release/*.apk

      - name: Upload nightly artifact
        uses: actions/upload-artifact@v4
        with:
          name: feliz-music-nightly
          path: app/build/outputs/apk/nightly/release/*.apk

      - name: Post nightly.link install link
        if: github.event_name == 'push'
        uses: actions/github-script@v7
        with:
          script: |
            const runId = context.runId;
            const repo = context.repo;
            const url = `https://nightly.link/${repo.owner}/${repo.repo}/actions/artifacts/${runId}.zip`;
            const body = `Nightly build for ${context.sha.slice(0, 7)} is ready.\n\nInstall: ${url}`;
            console.log(body);
            console.log('Post the nightly.link URL through your preferred channel; GitHub Releases remain the authoritative stable distribution source.');
