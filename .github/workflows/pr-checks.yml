name: Android PR Checks

on:
  pull_request:
    branches: [ main ]

jobs:
  checks:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check out pinned cipher
        run: bash scripts/checkout-cipher.sh

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: true

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install pinned native build components
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "platforms;android-36" "ndk;27.0.12077973" "cmake;3.22.1"

      - name: Configure Android SDK path
        run: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties
          echo "sdk.dir=$ANDROID_SDK_ROOT" > .deps/feliz-cipher/local.properties

      - name: Configure Firebase
        run: echo "${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}" | base64 -d > app/google-services.json

      - name: Run unit tests
        run: ./gradlew :app:testStableDebugUnitTest -PfelizCipherPath=.deps/feliz-cipher -PfirebaseProjectId=feliz-music-admin

      - name: Run cipher unit tests
        run: |
          cd .deps/feliz-cipher
          ./gradlew :library:testDebugUnitTest

      - name: UI audit
        run: bash scripts/ui-audit.sh

      - name: Assemble stable debug
        run: ./gradlew :app:assembleStableDebug -PfelizCipherPath=.deps/feliz-cipher -PfirebaseProjectId=feliz-music-admin

      - name: Compile stable release (R8/shrinker)
        run: ./gradlew :app:assembleStableRelease -PfelizCipherPath=.deps/feliz-cipher -PfirebaseProjectId=feliz-music-admin

      - name: Check 16 KB page-size alignment
        run: bash scripts/check-16kb-alignment.sh app/build/outputs/apk/stable/release/*.apk
