name: Stable Release

# Stable application: com.jtech.felizmusic. Signed releases are triggered only
# from signed vX.Y.Z tags and published to GitHub Releases with the APK, its
# SHA-256, release notes, and source revision. GitHub Releases is the
# authoritative distribution source; Telegram is optional.
on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check out pinned cipher
        run: bash scripts/checkout-cipher.sh

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install pinned native build components
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "platforms;android-36" "ndk;27.0.12077973" "cmake;3.22.1"

      - name: Configure Android SDK path
        run: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties
          echo "sdk.dir=$ANDROID_SDK_ROOT" > .deps/feliz-cipher/local.properties

      - name: Configure Firebase
        run: echo "${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}" | base64 -d > app/google-services.json

      - name: Configure stable release keystore
        run: |
          mkdir -p app/keystore
          echo "${{ secrets.STABLE_KEYSTORE_BASE64 }}" | base64 -d > app/keystore/release.keystore
          {
            echo "STORE_PASSWORD=${{ secrets.STABLE_STORE_PASSWORD }}"
            echo "KEY_PASSWORD=${{ secrets.STABLE_KEY_PASSWORD }}"
            echo "KEY_ALIAS=${{ secrets.STABLE_KEY_ALIAS }}"
          } >> "$GITHUB_ENV"

      - name: Assemble signed stable release
        run: ./gradlew :app:assembleStableRelease -PfelizCipherPath=.deps/feliz-cipher -PfirebaseProjectId=feliz-music-admin

      - name: Check 16 KB page-size alignment
        run: bash scripts/check-16kb-alignment.sh app/build/outputs/apk/stable/release/*.apk

      - name: Compute SHA-256
        run: |
          APK=$(find app/build/outputs/apk/stable/release -name '*.apk' | head -n 1)
          cp "$APK" feliz-music-stable.apk
          sha256sum feliz-music-stable.apk > feliz-music-stable.apk.sha256
          echo "APK_PATH=$PWD/feliz-music-stable.apk" >> "$GITHUB_ENV"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            feliz-music-stable.apk
            feliz-music-stable.apk.sha256
          body: |
            Feliz Music stable release ${{ github.ref_name }}

            - Package: `com.jtech.felizmusic`
            - Source revision: `${{ github.sha }}`
            - APK SHA-256: see `feliz-music-stable.apk.sha256`

            Install alongside the nightly build (`com.jtech.felizmusic.nightly`); each has independent local data.
          generate_release_notes: true

      - name: Optional Telegram notification
        if: always()
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          PRIMARY_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          JOB_STATUS: ${{ job.status }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          [ -n "$BOT_TOKEN" ] || exit 0
          if [ "$JOB_STATUS" == "success" ]; then STATUS="Success"; else STATUS="Failed"; fi
          MESSAGE=$(printf "Feliz Music stable release\n\nTag: %s\nStatus: %s" "$REF_NAME" "$STATUS")
          curl -s -X POST "https://api.telegram.org/bot${BOT_TOKEN}/sendMessage" \
            -d chat_id="$PRIMARY_CHAT_ID" --data-urlencode "text=${MESSAGE}" || true
